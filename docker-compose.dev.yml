services:
  app:
    build: .
    container_name: magic-app
    restart: unless-stopped
    ports:
      - "4317:4317"
    environment:
      - NODE_ENV=production
      - PORT=4317
      - MAGIC_DATA_DIR=/data/.magic
      - MAGIC_REPO_PATH=/data/.magic_repos
      - MAGIC_KEEP_REPO=true
      - MAGIC_PERSISTENCE=jsonl
      - MAGIC_PERMISSION_PRESET=workspace-write
      - MAGIC_NETWORK_MODE=localhost-only
      - MAGIC_API_TOKEN=${MAGIC_API_TOKEN:-}
    volumes:
      - magic-data:/data/.magic
      - magic-repos:/data/.magic_repos

  ollama:
    image: ollama/ollama:latest
    container_name: magic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

# magic-data holds sessions, KB, spill, etc.
# magic-repos is a separate named volume so it cannot be shadowed by
# the outer magic-data mount; both clean up cleanly with
# \`docker compose down -v\`.
volumes:
  magic-data:
  magic-repos:
  ollama-data:
